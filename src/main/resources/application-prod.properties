# ============================================
# PERFIL DE PRODUCCIÓN — Railway MySQL + Azure
# Se activa con SPRING_PROFILES_ACTIVE=prod
# ============================================

# Railway MySQL — URL pública (admite override por variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://ballast.proxy.rlwy.net:27731/railway?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:wlZqqkFXHOijaYYrgDGlMTsxzBUeXqZe}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool — conservador para tier gratuito
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Logging
logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO

# Puerto — Azure App Service inyecta PORT
server.port=${PORT:8080}
spring.application.name=alquiler-bicicletas-api

# Data Initialization (idempotente)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true
